name: Test error when inputs is missing
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The action requires 'inputs' to be non-empty.
      # Providing an empty string should cause the action to fail with
      # "Missing a list of input images to merge."
      # Note: 'inputs' is required=true in action.yml, so passing empty may
      # cause a different error. We use continue-on-error to capture the failure.
      - id: action
        uses: .
        with:
          inputs: ' '
          tags: myorg/myimage:latest
          push: 'false'
          fallback: 'true'
        continue-on-error: true

      - name: Assert action failed as expected
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          if [ "${{ steps.action.outcome }}" != "failure" ]; then
            echo "FAIL: expected action to fail when inputs is empty/whitespace, got: ${{ steps.action.outcome }}"
            exit 1
          fi
          echo "PASS: action correctly failed when inputs is empty"
