name: Test missing required inputs fails
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: action
        uses: .
        continue-on-error: true
        with:
          inputs: ''
          tags: ttl.sh/actionchain-never-pushed:1h
      - name: Assert action failed
        env:
          OUTCOME: ${{ steps.action.outcome }}
          IMAGES: ${{ steps.action.outputs.images }}
        run: |
          echo "outcome: $OUTCOME"
          echo "images: '$IMAGES'"
          if [ "$OUTCOME" != "failure" ]; then
            echo "FAIL: expected failure when 'inputs' is empty"
            exit 1
          fi
          if [ -n "$IMAGES" ]; then
            echo "FAIL: expected no images output"
            exit 1
          fi
          echo "PASS"
