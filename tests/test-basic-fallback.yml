name: Test basic fallback mode (docker manifest create)
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # Use fallback=true so the action uses `docker manifest create` instead of buildx
      # Use push=false so no registry credentials are needed
      # Use real public images that exist on Docker Hub
      - id: action
        uses: .
        with:
          inputs: alpine:3.18
          tags: myorg/myimage:latest
          push: 'false'
          fallback: 'true'
        continue-on-error: true

      # The action with fallback=true and push=false runs `docker manifest create`
      # which may fail if the manifest already exists or if the image isn't pulled,
      # but the action itself should run and set the images output (possibly empty since push=false)
      - name: Assert action ran (step completed)
        run: |
          echo "Action outcome: ${{ steps.action.outcome }}"
          # With push=false in fallback mode, images output will be empty string
          # The action may succeed or fail depending on docker manifest create behavior
          # We just verify the step ran (not skipped)
          if [ "${{ steps.action.outcome }}" = "skipped" ]; then
            echo "FAIL: action step was skipped unexpectedly"
            exit 1
          fi
          echo "PASS: action step ran"

      - name: Assert images output is empty when push is false
        env:
          ACTUAL: ${{ steps.action.outputs.images }}
        run: |
          echo "actual images output: '$ACTUAL'"
          # When push=false in fallback mode, no images are pushed so output should be empty
          if [ -n "$ACTUAL" ]; then
            echo "FAIL: expected empty images output when push=false, got: $ACTUAL"
            exit 1
          fi
          echo "PASS: images output is empty as expected when push=false"
